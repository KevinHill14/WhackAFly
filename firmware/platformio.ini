[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; Use the native USB-CDC port for Serial on the XIAO ESP32S3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Each env builds exactly one test sketch from src/.
; Run one with:  pio run -e thumbstick_test -t upload
[env:imu_test]
build_src_filter = -<*> +<main.cpp>
lib_deps =
    adafruit/Adafruit LSM6DS

[env:thumbstick_test]
build_src_filter = -<*> +<thumbstick_test.cpp>
