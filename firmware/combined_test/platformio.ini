; Self-contained project: tests the LSM6DSOX gyro and the analog thumbstick at the same time.
;   pio run -t upload        then        pio device monitor
[env:combined_test]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; Use the native USB-CDC port for Serial on the XIAO ESP32S3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit LSM6DS
